version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: mfa_user
      POSTGRES_PASSWORD: mfa_pass
      POSTGRES_DB: mfa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/.env

volumes:
  postgres_data:
